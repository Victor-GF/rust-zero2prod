name: zero2prod
region: nyc3
services:
  - name: zero2prod
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: master
      deploy_on_push: true
      repo: Victor-GF/rust-zero2prod
    health_check:
      http_path: /health_check
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

    envs:
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: "neondb_owner"
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: "ep-small-forest-ay9wppaj-pooler.c-5.us-east-2.aws.neon.tech"
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: "5432"
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: "newsletter"
      - key: APP_DATABASE__REQUIRE_SSL
        scope: RUN_TIME
        value: "true"
        
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        type: SECRET
